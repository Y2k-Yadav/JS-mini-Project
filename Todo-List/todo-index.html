<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="todo-style.css">
</head>
<body>

  <div class="container">
    <h1>To-Do List</h1>

    <div class="input-row">
      <input
        type="text"
        id="taskInput"
        class="task-input"
        placeholder="Add a new task..."
      >
      <button id="addBtn" class="add-btn">Add</button>
    </div>

    <div id="taskList" class="task-list">
      <!-- task items go here -->
      <div class="task-item">
        <p class="task-text">task4</p>
        <button class="delete-btn">&#10006;</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
