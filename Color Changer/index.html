<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Changer</title>
</head>
<body>
    <div class="main">
        <h1>Color Changer</h1>
        <div class="secondrow">
            <button class="rndclr">Random Color</button>
            <input type="text" name="" id="inputtag" placeholder="Enter a color or hex (e.g red or #f0f0f0)">
            <button class="aplycolor">Apply Color</button>
        </div>
        <p>Current Color :  <span>white</span></p>
    </div>
    
    <script src="./index.js"></script>
</body>
</html>
